layers:
  L0_analysis_ready:
    description: Source-specific analysis-ready data derived from real published measurements; no raw external archives.
    empirical_basis: real_measurements
  L1_evidence_records:
    description: Canonical typed cross-source evidence records with measurement boundaries, provenance and uncertainty semantics.
    empirical_basis: real_measurements_and_validated_derivations
  L2_uncertainty:
    description: Calibrated or explicitly non-identifiable uncertainty/dependence contracts.
    empirical_basis: mixed_empirical_and_methodological
  L3_benchmark_definitions:
    description: STACKWISE-authored candidate-stack and scenario definitions.
    empirical_basis: benchmark_definition
  L4_feasibility_and_support:
    description: Deterministic feasibility and evidence-support results derived from L1-L3.
    empirical_basis: derived_from_benchmark_and_evidence
  L5_synthetic_sensitivity:
    description: Explicit synthetic/protocol/cost sensitivity artifacts; never empirical measurements and never pooled as probabilities.
    empirical_basis: synthetic_or_model_derived

resolved_uncertainty_choices:
- choice_id: loed_scenario_block_robustness_family
  dataset_id: loed_lorawan_edge_2020
  status: materialised_without_single_probability_distribution
  decision: Retain 2019/2020 as fixed deployment scenarios and 3/7/14-day source-day
    block lengths as an unweighted model-robustness set. Center each non-circular
    MBB draw family on the observed campaign point estimate, preserve within-scenario
    RSSI/SNR and cross-PHY dependence, and report source-day support explicitly.
  guardrail: Do not interpret the outer robustness envelope as a probability interval
    or align replicate IDs across campaigns/block lengths.

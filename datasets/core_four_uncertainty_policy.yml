version: 1
scope: validated_core_four_stage2_evidence
publication_mcda_authorised: false
notes:
- Stage 3 begins with uncertainty specification and identifiability audit, not distribution
  fitting.
- Every core-four dataset/metric pair must map to exactly one uncertainty model specification.
- Distribution family selection is deferred unless supported by replicated or hierarchical
  calibration data.
- Vomhoff implementation hardware is not structured in retained Stage-2 source materials;
  no device random effect is invented.
dependence_groups:
- dependence_group_id: vomhoff_physical_run_multiphase
  dataset_id: vomhoff_nbiot_ltem_energy_2023
  level: physical_run
  meaning: Energy and duration phases from the same physical/source run share conditions
    and must be resampled together.
  calibration_status: available_from_analysis_ready_run_phase_artifact
- dependence_group_id: vomhoff_cross_figure_dependent_views
  dataset_id: vomhoff_nbiot_ltem_energy_2023
  level: derived_view
  meaning: Figure-4/Figure-5 shared HTTP runs and alternate Idle views are dependent
    derivations, not extra replication.
  calibration_status: encoded_in_stage2_lineage
- dependence_group_id: insectt_single_trace_configuration
  dataset_id: insectt_wsn_power_2023
  level: configuration_trace
  meaning: Millions of electrical samples describe one approximately 60 s trace per
    technology x reporting-period configuration.
  calibration_status: between_run_variability_not_identified
- dependence_group_id: insectt_shared_source_voltage
  dataset_id: insectt_wsn_power_2023
  level: shared_parameter
  meaning: All derived power and capture-energy records share the same inferred PPK
    II source-voltage parameter.
  calibration_status: uncertainty_distribution_pending
- dependence_group_id: lrfhss_single_trace_configuration
  dataset_id: lorawan_lrfhss_energy_2024
  level: configuration_trace
  meaning: Full-capture and incremental transaction energy from the same configuration
    inherit one physical trace.
  calibration_status: between_run_variability_not_identified
- dependence_group_id: lrfhss_ack_contrast_parent_pair
  dataset_id: lorawan_lrfhss_energy_2024
  level: matched_dr_contrast
  meaning: Each ACK/RX overhead contrast is a deterministic difference of one confirmed
    and one unconfirmed transaction record at the same DR.
  calibration_status: population_contrast_variability_not_identified
- dependence_group_id: loed_campaign_hierarchy
  dataset_id: loed_lorawan_edge_2020
  level: campaign
  meaning: LoED receptions are nested within source days, recurring gateway infrastructure
    and exact PHY strata. The two acquisition campaigns remain fixed deployment scenarios;
    within-campaign source-day block resampling is retained as a 3/7/14-day robustness
    family rather than one selected probability model.
  calibration_status: campaign_block_robustness_family_materialised
- dependence_group_id: loed_joint_rssi_snr
  dataset_id: loed_lorawan_edge_2020
  level: reception
  meaning: RSSI and SNR are measured on the same reception events and must not be
    independently sampled in a future link model.
  calibration_status: joint_scenario_block_draws_materialised
metric_models:
- uncertainty_model_id: unc_vomhoff_phase_energy
  dataset_id: vomhoff_nbiot_ltem_energy_2023
  metric_id: device_phase_energy_j
  support_domain: nonnegative_real
  evidence_uncertainty_regime: replicated_run_level
  population_variability_status: empirically_calibratable
  calibration_status: calibrated_nonparametric
  point_estimate_source: Stage-2 evidence summary; calibration source is logical_phase_observations.parquet
    at physical_run_id level.
  primary_sampling_unit: physical_run_id
  resampling_scheme: cluster_bootstrap_physical_run
  distribution_family_status: empirical_resampling_preferred
  dependence_group_ids:
  - vomhoff_physical_run_multiphase
  - vomhoff_cross_figure_dependent_views
  shared_parameter_ids: []
  study_effect_status: future_cross_study_prior_or_evidence_required
  implementation_effect_status: implementation_context_unknown
  bridge_uncertainty_status: pending_downstream_bridge
  forbidden_operations:
  - iid_bootstrap_of_source_segments
  - generic_study_random_effect_from_confounded_core_four
  calibration_artifacts:
  - data/analysis_ready/vomhoff_nbiot_ltem_energy_2023/logical_phase_observations.parquet
  - data/analysis_ready/vomhoff_nbiot_ltem_energy_2023/uncertainty/run_level_samples.parquet
  - data/analysis_ready/vomhoff_nbiot_ltem_energy_2023/uncertainty/marginal_calibration.csv
  - data/analysis_ready/vomhoff_nbiot_ltem_energy_2023/uncertainty/block_bootstrap_means.parquet
  - data/analysis_ready/vomhoff_nbiot_ltem_energy_2023/uncertainty/bootstrap_mean_summary.csv
  notes: Replicated run variability is identifiable within matched source configurations.
    Within-run phase dependence and cross-Figure dependent views must be preserved.
    Stage-3B uses block-wise nonparametric physical-run bootstrap; partial overlap
    preserves structural missingness without imputation or listwise deletion.

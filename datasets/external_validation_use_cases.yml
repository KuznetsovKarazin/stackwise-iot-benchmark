schema_version: 1
policy:
  no_silent_imputation: true
  mapping_status_values:
  - exact
  - interpretable
  - unavailable
  portfolio_min_hard_requirement_recovery_fraction: 0.7
  exclude_if_ambiguity_can_flip_multiple_families: true
use_cases:
- source_case_id: HINTS_A_SMART_BUILDING
  source_family: HINTS
  title: Smart building
  source_publication_doi: 10.1016/j.iot.2023.100678
  source_repository: https://github.com/SamirSim/Selection-Methodology-IoT
  source_repository_artifacts:
  - building-automation.txt
  - building-automation (copie 1).txt
  source_definition: Network technology and topology decision at design phase of a tailored smart-building
    solution with potentially growing end-device count.
  requirements_status: EXTRACTED_AND_REVIEWED
  requirements:
  - requirement_id: HINTS_A_01
    source_reference: Section 5.1; Table 13
    source_text_or_faithful_paraphrase: Minimal deployment contains 50 sensors.
    stackwise_field: external.device_count_min
    value: 50
    unit: devices
    mapping_status: unavailable
    hard_or_preference: hard
    interpretation_note: Device count is an explicit HINTS scalability input but is absent from the frozen
      STACKWISE scenario schema.
  - requirement_id: HINTS_A_02
    source_reference: Section 5.1; Table 13
    source_text_or_faithful_paraphrase: Maximal deployment contains 100 sensors.
    stackwise_field: external.device_count_max
    value: 100
    unit: devices
    mapping_status: unavailable
    hard_or_preference: hard
    interpretation_note: Maximum device count is not represented by the frozen STACKWISE scenario schema.
  - requirement_id: HINTS_A_03
    source_reference: Section 5.1; Table 13
    source_text_or_faithful_paraphrase: Sensors use 2,400 mAh batteries at 3 V.
    stackwise_field: external.battery_capacity_and_voltage
    value: 2.4 Ah @ 3 V
    unit: battery_context
    mapping_status: unavailable
    hard_or_preference: hard
    interpretation_note: Battery context cannot be converted to a per-report whole-device energy budget
      without an explicit bridge and non-communication accounting.
  - requirement_id: HINTS_A_04
    source_reference: Section 5.1; Table 13
    source_text_or_faithful_paraphrase: Traffic direction is upstream.
    stackwise_field: external.traffic_direction
    value: upstream
    unit: categorical
    mapping_status: interpretable
    hard_or_preference: hard
    interpretation_note: Direction semantics are recoverable but no dedicated frozen scenario field exists.
  - requirement_id: HINTS_A_05
    source_reference: Section 5.1; Table 13
    source_text_or_faithful_paraphrase: Each message is 100 bytes.
    stackwise_field: quantitative_context.payload_bytes
    value: 100
    unit: bytes
    mapping_status: exact
    hard_or_preference: hard
    interpretation_note: Direct match to the frozen payload field.
  - requirement_id: HINTS_A_06
    source_reference: Section 5.1; Table 13
    source_text_or_faithful_paraphrase: Sensors send one packet per second in both minimal and maximal
      workload.
    stackwise_field: quantitative_context.reporting_interval_s
    value: 1.0
    unit: s
    mapping_status: exact
    hard_or_preference: hard
    interpretation_note: Periodic workload maps exactly to a one-second reporting interval.
  - requirement_id: HINTS_A_07
    source_reference: Section 5.1; Table 13
    source_text_or_faithful_paraphrase: The radio environment is indoor.
    stackwise_field: external.radio_environment
    value: indoor
    unit: categorical
    mapping_status: interpretable
    hard_or_preference: hard
    interpretation_note: Environment semantics are explicit but not a frozen hard-screen field.
  - requirement_id: HINTS_A_08
    source_reference: Section 5.1 versus Table 13
    source_text_or_faithful_paraphrase: The narrative states a deployment scope of 100 m, whereas Table
      13 reports 50 m.
    stackwise_field: external.deployment_scope_m
    value: source_conflict_100_vs_50
    unit: m
    mapping_status: unavailable
    hard_or_preference: hard
    interpretation_note: Published sources conflict; no exact value is admitted to the frozen hard screen.
    source_conflict: true
  - requirement_id: HINTS_A_09
    source_reference: Section 5.1; Table 13
    source_text_or_faithful_paraphrase: Expected scenario lifetime is two years (730 days).
    stackwise_field: external.expected_lifetime_days
    value: 730
    unit: days
    mapping_status: unavailable
    hard_or_preference: hard
    interpretation_note: Expected project lifetime is not a frozen scenario field.
  - requirement_id: HINTS_A_10
    source_reference: Section 5.1; Tables 10 and 14
    source_text_or_faithful_paraphrase: Message delivery target is greater than 90%.
    stackwise_field: decision_target.delivery_probability
    value: 0.9
    unit: probability_minimum
    mapping_status: interpretable
    hard_or_preference: hard
    interpretation_note: The evidence target exists in STACKWISE, but the threshold is not a direct frozen
      scenario field.
  - requirement_id: HINTS_A_11
    source_reference: Section 5.1 versus Tables 10 and 14
    source_text_or_faithful_paraphrase: The narrative requests at least about three months of battery
      life, while Tables 10 and 14 evaluate an 80-day threshold.
    stackwise_field: external.battery_lifetime_goal_days
    value: source_conflict_three_months_vs_80_days
    unit: days_minimum
    mapping_status: unavailable
    hard_or_preference: hard
    interpretation_note: Conflicting published requirement; no exact energy-budget bridge is created.
    source_conflict: true
  - requirement_id: HINTS_A_12
    source_reference: Section 5.1; Tables 10 and 14
    source_text_or_faithful_paraphrase: Message latency target is below 100 ms.
    stackwise_field: quantitative_context.target_end_to_end_latency_ms
    value: 100
    unit: ms
    mapping_status: exact
    hard_or_preference: hard
    interpretation_note: Direct match to the frozen end-to-end latency target field.
  - requirement_id: HINTS_A_13
    source_reference: Section 5.1; Table 14
    source_text_or_faithful_paraphrase: Financial cost is a preference criterion without a hard threshold.
    stackwise_field: decision_target.lifecycle_cost_eur
    value: minimise
    unit: objective
    mapping_status: interpretable
    hard_or_preference: preference
    interpretation_note: Cost is represented as a decision target but not as a hard scenario constraint.
  source_artifact_reference: HINTS (2023), Section 5.1, Tables 10, 13 and 14; Table 5 for application-model
    structure; companion repository retained as implementation evidence only.
  source_document_policy: Published case-study narrative and final case tables define the external case.
    Repository artefacts are implementation evidence and do not silently override the paper. Conflicting
    published values are retained as source discrepancies and are not used as exact hard-screen inputs.
  validation_role: external_scenario_portability_and_decision_readiness_not_winner_replication

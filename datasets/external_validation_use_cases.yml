- source_case_id: VANNIEUWENBORG_SMART_CONTAINERS
  source_family: VANNIEUWENBORG_2018
  title: Smart shipping containers — Port of Antwerp
  source_publication_doi: 10.1002/ett.3308
  source_repository: https://biblio.ugent.be/publication/8565242
  source_definition: Published connectivity-selection case for smart shipping containers in the Port of
    Antwerp.
  requirements_status: EXTRACTED_AND_REVIEWED
  requirements:
  - requirement_id: VC_SC_01
    source_reference: Section 3.1
    source_text_or_faithful_paraphrase: Approximately 100,000 containers are to be equipped with temporary
      IoT end nodes while on site.
    stackwise_field: external.device_count
    value: 100000
    unit: devices
    mapping_status: unavailable
    hard_or_preference: hard
    interpretation_note: Exact source requirement; frozen benchmark scenario ontology has no device-count
      field.
  - requirement_id: VC_SC_02
    source_reference: Section 3.1
    source_text_or_faithful_paraphrase: The port site covers approximately 120 square kilometres.
    stackwise_field: external.coverage_area_km2
    value: 120
    unit: km2
    mapping_status: unavailable
    hard_or_preference: hard
    interpretation_note: Exact source requirement; no coverage-area field exists in the frozen scenario
      schema.
  - requirement_id: VC_SC_03
    source_reference: Section 3.1
    source_text_or_faithful_paraphrase: Area-based container location is required together with monitoring
      of door openings, humidity, indoor temperature and acceleration.
    stackwise_field: external.localization_requirement
    value: area_based_location_required
    unit: categorical
    mapping_status: unavailable
    hard_or_preference: hard
    interpretation_note: Localization capability is explicitly important in the source but is not a frozen
      STACKWISE scenario field.
  - requirement_id: VC_SC_04
    source_reference: Section 3.1
    source_text_or_faithful_paraphrase: A real-time connection is not required; threshold alerts trigger
      transmission events.
    stackwise_field: external.traffic_trigger_mode
    value: event_driven_non_realtime
    unit: categorical
    mapping_status: interpretable
    hard_or_preference: hard
    interpretation_note: Semantics are recoverable, but the source does not provide a numeric reporting
      interval or latency ceiling required for an exact frozen-field mapping.
  - requirement_id: VC_SC_05
    source_reference: Section 3.1
    source_text_or_faithful_paraphrase: Desired device lifetime is at least five years to reduce handling
      costs.
    stackwise_field: external.device_lifetime_years
    value: 5
    unit: years_minimum
    mapping_status: unavailable
    hard_or_preference: hard
    interpretation_note: Cannot be converted to per-report energy budget without battery capacity and
      workload accounting; no imputation is permitted.
  source_artifact_reference: Vannieuwenborg et al. (2018), Section 3.1 and Table 4
- source_case_id: VANNIEUWENBORG_SMART_PARKING
  source_family: VANNIEUWENBORG_2018
  title: Shop'n Go smart parking
  source_publication_doi: 10.1002/ett.3308
  source_repository: https://biblio.ugent.be/publication/8565242
  source_definition: Published connectivity-selection case for Shop'n Go vehicle-presence parking spaces.
  requirements_status: EXTRACTED_AND_REVIEWED
  requirements:
  - requirement_id: VC_SP_01
    source_reference: Section 3.2
    source_text_or_faithful_paraphrase: Parking sensors register vehicle arrival and departure and send
      an alert when the allowed parking time is exceeded.
    stackwise_field: external.traffic_trigger_mode
    value: event_driven_alerting
    unit: categorical
    mapping_status: interpretable
    hard_or_preference: hard
    interpretation_note: Event-driven semantics are recoverable; no exact reporting interval is stated.
  - requirement_id: VC_SP_02
    source_reference: Section 3.2
    source_text_or_faithful_paraphrase: Sensor lifetime must be at least five years.
    stackwise_field: external.device_lifetime_years
    value: 5
    unit: years_minimum
    mapping_status: unavailable
    hard_or_preference: hard
    interpretation_note: Cannot be translated to whole-device energy per report without battery/workload
      assumptions.
  - requirement_id: VC_SP_03
    source_reference: Section 3.2
    source_text_or_faithful_paraphrase: No more than 50 parking places are expected within an area of
      at most 1.5 square kilometres.
    stackwise_field: external.device_density_context
    value: 50_devices_per_1.5_km2_max
    unit: categorical
    mapping_status: unavailable
    hard_or_preference: hard
    interpretation_note: Exact source density/area context; frozen scenario schema has no device-density
      field.
  - requirement_id: VC_SP_04
    source_reference: Section 3.2
    source_text_or_faithful_paraphrase: A midsized city is assumed to contain six such areas, for 300

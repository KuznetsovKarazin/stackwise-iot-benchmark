claims:
  cellular_eps_ip:
    statement: EPS provides packet-switched IP connectivity; the Stage-4B cellular IP variants represent IP PDN operation
      rather than all possible CIoT modes.
    source_ids:
    - etsi_3gpp_ts_23_401_r17
    verification_status: primary_source_verified
  cellular_ciot_nonip:
    statement: CIoT EPS supports a Non-IP PDN type; NB-IoT/LTE-M Non-IP operation is modelled separately from IP PDN variants.
    source_ids:
    - etsi_3gpp_ts_23_401_r17
    - etsi_3gpp_ts_23_682_r17
    verification_status: primary_source_verified
  nbiot_ltem_ciot_families:
    statement: NB-IoT and LTE-M are cellular IoT access families in the 3GPP EPS/LTE ecosystem.
    source_ids:
    - 3gpp_ciot_overview
    verification_status: primary_source_verified
  lorawan_backend_architecture:
    statement: LoRaWAN gateways relay end-device messages to a Network Server, which routes packets to an Application Server.
    source_ids:
    - lorawan_ts001_1_0_4
    verification_status: primary_source_verified
  lorawan_lrfhss_mode:
    statement: LoRaWAN Regional Parameters define LR-FHSS data rates as LoRaWAN regional PHY/data-rate options.
    source_ids:
    - lorawan_rp002_1_0_4
    verification_status: primary_source_verified
  thread_ipv6_application_agnostic:
    statement: Thread is an IPv6-based networking solution and is application-layer agnostic.
    source_ids:
    - thread_network_fundamentals
    verification_status: primary_source_verified
  thread_border_router:
    statement: A Thread Border Router provides connectivity between a Thread IPv6 mesh and adjacent IP infrastructure.
    source_ids:
    - thread_border_router_best_practices
    verification_status: primary_source_verified
  ble_gatt:
    statement: Bluetooth GATT uses ATT to exchange attribute commands, requests, responses, indications and notifications.
    source_ids:
    - bluetooth_core_gatt_5_4
    verification_status: primary_source_verified
  ble_ipsp_ipv6:
    statement: Bluetooth IPSP supports exchange of IPv6 packets over Bluetooth Low Energy and defines Node/Router roles using
      L2CAP.
    source_ids:
    - bluetooth_ipsp_1_0
    - rfc_7668
    verification_status: primary_source_verified
  uwb_phy_mac_ranging:
    statement: IEEE 802.15.4z enhances UWB PHY/MAC and associated ranging techniques; no generic IP service is inferred from
      this claim.
    source_ids:
    - ieee_802_15_4z_2020
    verification_status: primary_source_verified
  udp_requires_ip:
    statement: UDP is a datagram transport defined for operation over IP.
    source_ids:
    - rfc_768
    verification_status: primary_source_verified
  tcp_reliable_stream:
    statement: TCP provides the reliable host-to-host stream transport used as a reliable byte-stream service in the catalog.
    source_ids:
    - rfc_9293
    verification_status: primary_source_verified
  tls13_reliable_stream:
    statement: TLS 1.3 requires an underlying reliable, in-order data stream and provides an authenticated/confidential/integrity-protected
      secure channel.
    source_ids:
    - rfc_9846
    verification_status: primary_source_verified
  dtls13_datagram_security:
    statement: DTLS 1.3 provides TLS-like security over datagram/unreliable transports.
    source_ids:
    - rfc_9147
    verification_status: primary_source_verified
  coap_udp_dtls:
    statement: Base CoAP exchanges messages over UDP and defines a DTLS-secured CoAP binding.
    source_ids:
    - rfc_7252
    verification_status: primary_source_verified
  coap_tcp_tls:
    statement: CoAP is also specified over TCP and TLS.
    source_ids:
    - rfc_8323
    verification_status: primary_source_verified
  oscore_coap:
    statement: OSCORE provides end-to-end object security for CoAP messages.
    source_ids:
    - rfc_8613
    verification_status: primary_source_verified
  mqtt_ordered_lossless:
    statement: MQTT 5.0 requires an underlying ordered, lossless, bidirectional byte stream; TCP is a suitable transport.
    source_ids:
    - mqtt_5_0
    verification_status: primary_source_verified
  mqtt_tls:
    statement: MQTT 5.0 identifies TLS as a suitable secured transport; the catalog keeps plain-stream and TLS-bound variants
      separate.
    source_ids:
    - mqtt_5_0
    - rfc_9846
    verification_status: primary_source_verified
  http11_stream:
    statement: HTTP is an application-level protocol and HTTP/1.1 defines connection/message handling over a stream transport.
    source_ids:
    - rfc_9110
    - rfc_9112
    verification_status: primary_source_verified
  http11_tls:
    statement: HTTPS semantics use HTTP over a TLS-secured connection; the catalog keeps HTTP/TCP and HTTP/TLS variants separate.
    source_ids:
    - rfc_9110
    - rfc_9846
    verification_status: primary_source_verified
  lwm2m_core:
    statement: LwM2M defines RESTful device-management/service-enablement and information-reporting interfaces.
    source_ids:
    - lwm2m_core_1_2_2
    verification_status: primary_source_verified
  lwm2m_transport_bindings:
    statement: LwM2M 1.2 supports CoAP over UDP/DTLS/TCP/TLS, MQTT over TLS/TCP, HTTP over TLS/TCP, and CoAP over Non-IP including
      3GPP CIoT and LoRaWAN; OSCORE may protect CoAP bindings.
    source_ids:
    - lwm2m_transport_1_2_2
    - lwm2m_core_1_2_2
    verification_status: primary_source_verified

unresolved_catalog_gaps:
- gap_id: ephesos_standardisation
  status: unresolved
  description: EPhESOS has empirical energy evidence but no interoperable primary-source standard/profile is materialised
    in Stage-4B.
  consequence: Do not create a verified EPhESOS end-to-end stack.
- gap_id: insectt_ble_profile
  status: unresolved
  description: InSecTT BLE energy does not identify a Stage-4B IPSP/IPv6 profile boundary.
  consequence: BLE access evidence cannot be silently reused as Bluetooth IPSP energy.
- gap_id: insectt_uwb_revision
  status: unresolved
  description: Exact IEEE UWB revision/profile alignment of the DW1000 measurement setup is not established by the current
    catalog.
  consequence: UWB evidence remains implementation-specific.
- gap_id: vomhoff_application_versions
  status: unresolved
  description: Vomhoff source labels HTTP/MQTT but do not establish the exact Stage-4B HTTP/MQTT version/security binding
    in the evidence record.
  consequence: Do not attach those measurements directly to HTTP/1.1 or MQTT 5/TLS component costs.
- gap_id: loed_vs_lrfhss_link_mode
  status: unresolved
  description: LoED link-quality evidence is classical LoRa SF7-SF12 and does not validate LR-FHSS link-quality distributions.
  consequence: LR-FHSS feasibility cannot inherit LoED RSSI/SNR distributions without a separate bridge/evidence source.
- gap_id: lorawan_generic_backend_integration
  status: unresolved
  description: LoRaWAN L2 verifies Network Server/Application Server architecture, but a deployment-specific bridge from Application
    Server payloads to MQTT/HTTP is not standardized by LoRaWAN L2 itself.
  consequence: Future MQTT/HTTP LoRaWAN backend stacks require an explicit integration component and provenance.

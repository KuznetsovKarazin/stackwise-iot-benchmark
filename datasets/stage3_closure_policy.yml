notes:
  - Stage 3 closes the uncertainty-characterisation layer for the validated core-four evidence; it does not imply that every metric has a probability distribution.
  - A non-identifiable population variance remains an explicit epistemic gap rather than receiving a default CV, SD, or fabricated prior.
  - LoED campaigns and block lengths remain unweighted robustness scenarios rather than draws from one population distribution.
  - Publication-wide stochastic sampling remains blocked until downstream bridge models define which uncertainty semantics are admissible for each decision estimand.

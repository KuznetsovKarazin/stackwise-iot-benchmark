    stage3_resolution_status: resolved_for_current_evidence_as_robustness
    probability_semantics: unweighted_scenario_family_no_probability_measure
    future_sampling_rule: keep_campaign_and_block_length_indices_explicit_and_unweighted
  external_prior_required:
    resolution_class: explicit_epistemic_gap
    stage3_resolution_status: closed_with_nonidentifiability
    probability_semantics: no_population_probability_distribution_identified
    future_sampling_rule: no_stochastic_sampling_without_new_repeatability_evidence_or_an_explicit_model_sensitivity_scenario
  descriptive_only:
    resolution_class: descriptive_nonprobability
    stage3_resolution_status: resolved_as_nonprobabilistic

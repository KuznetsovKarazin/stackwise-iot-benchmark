handoff_rules:
  - Stage 4 may define candidate communication stacks and hard compatibility constraints without assigning MCDA scores or ranks.
  - Future energy/latency/link/cost bridges must consume the uncertainty semantics attached to the parent evidence rather than coercing all inputs to one distribution family.
  - LoED campaign and block-length scenarios must not receive probability weights unless a later, separately justified model supplies them.
  - InSecTT/LR-FHSS single-trace point evidence may be used for deterministic feasibility/bridge construction, but population stochastic sampling remains disabled unless new evidence or an explicitly labelled sensitivity assumption is introduced.
  - Instrument metrology statements must remain distinct from between-run or between-device population variability.

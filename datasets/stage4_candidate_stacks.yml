  - stack_id: lorawan_lora_lwm2m_nonip
    name: LoRaWAN LoRa + backend + LwM2M Non-IP
    description: Classical LoRaWAN access with explicit LoRaWAN backend path and LwM2M Non-IP binding.
    component_instances:
      - {instance_id: access, component_id: lorawan_lora_access, placement: device}
      - {instance_id: backend, component_id: lorawan_network_application_backend, placement: network_service}
      - {instance_id: lwm2m, component_id: lwm2m12, placement: device}
    bindings:
      - {from_instance_id: access, to_instance_id: backend, interface: lorawan_frame_service, relation: bridges}
      - {from_instance_id: access, to_instance_id: lwm2m, interface: lorawan_nonip_transport_service, relation: carries}
    environment_capabilities: []
    primary_access_instance_id: access
    scientific_status: verified_candidate
    notes: LoED supplies only reception-side classical-LoRa link evidence; it does not provide delivery probability or energy.

  - stack_id: lorawan_lrfhss_lwm2m_nonip
    name: LoRaWAN LR-FHSS + backend + LwM2M Non-IP
    description: LR-FHSS access with explicit LoRaWAN backend path and LwM2M Non-IP binding.
    component_instances:
      - {instance_id: access, component_id: lorawan_lrfhss_access, placement: device}
      - {instance_id: backend, component_id: lorawan_network_application_backend, placement: network_service}
      - {instance_id: lwm2m, component_id: lwm2m12, placement: device}
    bindings:

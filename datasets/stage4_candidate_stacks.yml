  - stack_id: nbiot_nonip_lwm2m
    name: NB-IoT CIoT Non-IP + LwM2M
    description: Verified LwM2M Non-IP reference binding over NB-IoT CIoT Non-IP service.
    component_instances:
      - {instance_id: access, component_id: 3gpp_nbiot_eps_nonip, placement: device}
      - {instance_id: lwm2m, component_id: lwm2m12, placement: device}
    bindings:
      - {from_instance_id: access, to_instance_id: lwm2m, interface: ciot_nonip_service, relation: carries}
    environment_capabilities: []
    primary_access_instance_id: access

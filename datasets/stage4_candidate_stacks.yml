schema_version: 1
stage: Stage-4C verified reference candidate stacks
scientific_policy:
  candidate_set_is_exhaustive: false
  every_verified_binding_requires_catalog_edge: true
  every_verified_candidate_component_primary_source_verified: true
  full_end_to_end_empirical_support_required_for_structural_candidate: false
  evidence_alignment_implies_full_stack_cost: false
  unresolved_catalog_gap_silently_closed: false
  mcda_authorised: false
  ranking_authorised: false
  stakeholder_weights_authorised: false

candidate_stacks:
  - stack_id: nbiot_ip_coap_dtls_lwm2m
    name: NB-IoT IP + UDP + DTLS 1.3 + CoAP + LwM2M
    description: Verified datagram-management reference path over NB-IoT IP-PDN access.
    component_instances:
      - {instance_id: access, component_id: 3gpp_nbiot_eps_ip, placement: device}
      - {instance_id: udp, component_id: udp, placement: device}
      - {instance_id: dtls, component_id: dtls13, placement: device}
      - {instance_id: coap, component_id: coap, placement: device}
      - {instance_id: lwm2m, component_id: lwm2m12, placement: device}
    bindings:
      - {from_instance_id: access, to_instance_id: udp, interface: ip_packet_service, relation: carries}
      - {from_instance_id: udp, to_instance_id: dtls, interface: datagram_service, relation: secures}
      - {from_instance_id: dtls, to_instance_id: coap, interface: secure_datagram_service, relation: carries}
      - {from_instance_id: coap, to_instance_id: lwm2m, interface: coap_message_service, relation: carries}
    environment_capabilities: []
    primary_access_instance_id: access
    scientific_status: verified_candidate
    notes: Structural candidate only; Vomhoff did not measure this CoAP/LwM2M composition.

  - stack_id: ltem_ip_coap_dtls_lwm2m
    name: LTE-M IP + UDP + DTLS 1.3 + CoAP + LwM2M
    description: Verified datagram-management reference path over LTE-M IP-PDN access.
    component_instances:
      - {instance_id: access, component_id: 3gpp_ltem_eps_ip, placement: device}
      - {instance_id: udp, component_id: udp, placement: device}
      - {instance_id: dtls, component_id: dtls13, placement: device}
      - {instance_id: coap, component_id: coap, placement: device}
      - {instance_id: lwm2m, component_id: lwm2m12, placement: device}
    bindings:
      - {from_instance_id: access, to_instance_id: udp, interface: ip_packet_service, relation: carries}
      - {from_instance_id: udp, to_instance_id: dtls, interface: datagram_service, relation: secures}
      - {from_instance_id: dtls, to_instance_id: coap, interface: secure_datagram_service, relation: carries}
      - {from_instance_id: coap, to_instance_id: lwm2m, interface: coap_message_service, relation: carries}
    environment_capabilities: []
    primary_access_instance_id: access
    scientific_status: verified_candidate
    notes: Structural candidate only; Vomhoff did not measure this CoAP/LwM2M composition.

  - stack_id: nbiot_ip_mqtt_tls_lwm2m
    name: NB-IoT IP + TCP + TLS 1.3 + MQTT 5 + LwM2M
    description: Verified secure-stream management reference path over NB-IoT IP-PDN access.
    component_instances:
      - {instance_id: access, component_id: 3gpp_nbiot_eps_ip, placement: device}
      - {instance_id: tcp, component_id: tcp, placement: device}
      - {instance_id: tls, component_id: tls13, placement: device}
      - {instance_id: mqtt, component_id: mqtt5_tls, placement: device}
      - {instance_id: lwm2m, component_id: lwm2m12, placement: device}
    bindings:
      - {from_instance_id: access, to_instance_id: tcp, interface: ip_packet_service, relation: carries}
      - {from_instance_id: tcp, to_instance_id: tls, interface: reliable_stream_service, relation: secures}
      - {from_instance_id: tls, to_instance_id: mqtt, interface: secure_stream_service, relation: carries}
      - {from_instance_id: mqtt, to_instance_id: lwm2m, interface: secure_mqtt_message_service, relation: carries}
    environment_capabilities: []
    primary_access_instance_id: access
    scientific_status: verified_candidate
    notes: Vomhoff MQTT context is only partial empirical support because exact version/security binding is unresolved.

  - stack_id: ltem_ip_mqtt_tls_lwm2m
    name: LTE-M IP + TCP + TLS 1.3 + MQTT 5 + LwM2M
    description: Verified secure-stream management reference path over LTE-M IP-PDN access.
    component_instances:

capability_claims:
  - claim_id: nbiot_idle_cell_reselection
    access_family: NB-IoT
    capability_key: idle_cell_reselection_supported_verified
    value: true
    verification_status: primary_source_verified
    source_authority: ETSI/3GPP
    source_identifier: ETSI TS 136 304 V18.1.0 / 3GPP TS 36.304 Release 18
    source_url: https://www.etsi.org/deliver/etsi_ts/136300_136399/136304/18.01.00_60/ts_136304v180100p.pdf
    interpretation: NB-IoT has specified intra/inter-frequency cell-reselection procedures in idle/inactive operation.
  - claim_id: nbiot_connected_handover
    access_family: NB-IoT
    capability_key: connected_mode_handover_supported_verified
    value: false
    verification_status: primary_source_verified_scope_specific
    source_authority: ETSI/3GPP
    source_identifier: ETSI TS 136 331 V18.8.0 / 3GPP TS 36.331 Release 18
    source_url: https://www.etsi.org/deliver/etsi_TS/136300_136399/136331/18.08.00_60/ts_136331v180800p.pdf
    interpretation: The RRC connection-mobility handover function is not generally applicable to NB-IoT; the specification note limits the NB-IoT applicability within that function.
  - claim_id: ltem_idle_cell_reselection
    access_family: LTE-M
    capability_key: idle_cell_reselection_supported_verified
    value: true
    verification_status: primary_source_verified
    source_authority: ETSI/3GPP
    source_identifier: ETSI TS 136 304 V18.1.0 / 3GPP TS 36.304 Release 18
    source_url: https://www.etsi.org/deliver/etsi_ts/136300_136399/136304/18.01.00_60/ts_136304v180100p.pdf
    interpretation: LTE-M is an E-UTRA UE class and uses the standardized E-UTRA idle-mode cell-reselection machinery.
  - claim_id: ltem_connected_handover
    access_family: LTE-M
    capability_key: connected_mode_handover_supported_verified
    value: true
    verification_status: primary_source_verified

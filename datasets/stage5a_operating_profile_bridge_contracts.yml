  stage4f_required_fields_unresolved: 20
  complete_profiles: 0
  partial_profiles: 3
  bridge_contracts: 3
  bridges_ready_for_numeric_evaluation: 0
  bridges_blocked_by_unresolved_profile: 3
  bridges_with_no_matched_source: 2
  bridges_with_boundary_transform_required: 1

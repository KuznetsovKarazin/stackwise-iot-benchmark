lower_bound_decision_contract:
  match_fields:
    - application_payload_bytes
    - lrfhss_data_rate
    - confirmation_mode
    - tx_power_dbm
    - radio_hardware
    - receive_window_policy
    - accounting_boundary
    - minimum_uplink_transactions_per_report
  unresolved_fields_not_required_for_one_sided_exclusion:
    - retry_policy
    - end_device_hardware
    - reporting_cycle_definition
  rationale: >-
    A validated incremental radio transaction above the whole-device/report budget is a monotone lower-bound exclusion.
    Unknown residual whole-device energy, additional retries, sensing/processing energy and reporting-cycle baseline cannot reduce
    the already-observed/modelled radio component below that lower bound. These unresolved fields still block any whole-device
    numeric estimate or feasibility claim when the radio component is at or below budget.

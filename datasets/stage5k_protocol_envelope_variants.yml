schema_version: 1
stage: Stage-5K parameterised cellular IP protocol-envelope variants
stage5_status: compact_deterministic_sensitivity_grid_materialised_exact_wire_volume_still_blocked

scientific_policy:
  inherited_session_profile_contract: datasets/stage5j_cellular_ip_session_profile.yml
  inherited_tariff_evidence: datasets/stage5i_dated_cellular_cost_evidence.yml
  standards_review_date: '2026-08-12'
  variant_semantics: deterministic_sensitivity_anchors_not_empirical_deployment_profiles
  assign_variant_probabilities: false
  infer_typical_variant: false
  use_variant_frequency_weights: false
  enumerate_full_cartesian_product: false
  variant_field_assignments_may_be_used_as_empirical_observations: false
  raw_tariff_overhead_budget_authorised: true
  exact_wire_volume_authorised: false
  tariff_topup_count_authorised: false
  canonical_report_energy_authorised: false
  publication_mcda_authorised: false
  tariff_megabyte_definition_bytes: 1000000

# Every baseline value below is a benchmark/sensitivity anchor, not an empirical prevalence claim.
# Fields are the unresolved Stage-5J profile fields. Dynamic values are resolved per scenario.
baseline_assignments:
  common:
    lwm2m_payload_encoding: SenML_CBOR
    ip_version: IPv4
    security_context_lifecycle: persistent_across_reports
    session_reestablishment_or_resumption_cadence: none_within_reporting_horizon
    failure_retry_retransmission_profile: no_application_retry
  coap_dtls_udp:
    coap_message_type: NON
    coap_token_length_bytes: 0
    coap_response_exchange_mode: non_confirmable_response_exchange
    dtls_connection_id_length_bytes: 0
    dtls_sequence_number_length_bytes: 1
    dtls_length_field_present: false
    dtls_aead_expansion_bytes: 16
    dtls_padding_bytes: 0
  mqtt_tls_tcp:
    mqtt_endpoint_name_bytes: 36
    mqtt_prefix_bytes: 0
    mqtt_qos: 0
    mqtt_keep_alive_s: 0
    lwm2m_mqtt_token_cbor_bytes: 2
    tcp_header_options_bytes: 0
    tls_aead_expansion_bytes: 16
    tls_padding_bytes: 0

anchor_designs:
  - anchor_id: A0_compact_persistent
    changed_dimensions: none_reference_anchor
    rationale: Compact deterministic reference anchor; not a typical-deployment claim.

  - anchor_id: A1_ipv6
    changed_dimensions: ip_version
    common_overrides:
      ip_version: IPv6
    rationale: Isolates IP-family overhead sensitivity.

  - anchor_id: A2_acknowledged_delivery
    changed_dimensions: application_delivery_acknowledgement
    coap_dtls_udp_overrides:
      coap_message_type: CON
      coap_response_exchange_mode: piggybacked_ack_response
    mqtt_tls_tcp_overrides:
      mqtt_qos: 1
    rationale: Adds binding-native acknowledgement/reliability semantics without changing session lifetime.

  - anchor_id: A3_lwm2m_cbor
    changed_dimensions: lwm2m_payload_encoding
    common_overrides:
      lwm2m_payload_encoding: LwM2M_CBOR
    rationale: Binary LwM2M-CBOR representation sensitivity permitted by LwM2M Send.

  - anchor_id: A4_senml_json
    changed_dimensions: lwm2m_payload_encoding
    common_overrides:
      lwm2m_payload_encoding: SenML_JSON
    rationale: Textual SenML representation stress anchor permitted by LwM2M Send.

  - anchor_id: A5_resume_each_report
    changed_dimensions: security_context_lifecycle|session_reestablishment_or_resumption_cadence
    common_overrides:
      security_context_lifecycle: resumed_security_context
      session_reestablishment_or_resumption_cadence: once_per_application_report
    rationale: Deterministic resumption-per-report sensitivity; no empirical frequency is implied.

  - anchor_id: A6_full_reestablishment_each_report
    changed_dimensions: security_context_lifecycle|session_reestablishment_or_resumption_cadence
    common_overrides:
      security_context_lifecycle: full_security_context_reestablishment
      session_reestablishment_or_resumption_cadence: once_per_application_report
    rationale: Deterministic full-handshake-per-report stress anchor; no empirical frequency is implied.

  - anchor_id: A7_single_retry
    changed_dimensions: failure_retry_retransmission_profile
    common_overrides:
      failure_retry_retransmission_profile: one_full_transaction_retry_per_application_report
    rationale: One-retry deterministic stress anchor; not a probability model for failures.

  - anchor_id: A8_binding_expanded
    changed_dimensions: binding_specific_header_and_reliability_choices
    coap_dtls_udp_overrides:
      coap_message_type: CON
      coap_token_length_bytes: 8
      coap_response_exchange_mode: separate_confirmable_response
      dtls_connection_id_length_bytes: 1
      dtls_sequence_number_length_bytes: 2
      dtls_length_field_present: true
    mqtt_tls_tcp_overrides:
      mqtt_prefix_bytes: 8
      mqtt_qos: 2
      mqtt_keep_alive_s: HALF_REPORTING_INTERVAL
      tcp_header_options_bytes: 40
    rationale: >-
      Joint expanded binding-specific anchor. CoAP uses the RFC 7252 token maximum and the larger DTLS 1.3
      sequence/length-header choices with a one-octet CID sensitivity. MQTT uses the OMA example prefix length,
      QoS 2, a keep-alive equal to half the reporting interval, and the standards-bounded TCP option-space maximum.
      Combined choices are synthetic stress parameters, not a deployment-prevalence claim.

standards_evidence:
  - evidence_id: oma_lwm2m_core_1_2_2_send_formats
    source_type: normative_specification
    source_identifier: OMA LwM2M Core 1.2.2
    source_url: https://www.openmobilealliance.org/release/lightweightm2m/V1_2_2-20240613-A/HTML-Version/OMA-TS-LightweightM2M_Core-V1_2_2-20240613-A.html
    access_date: '2026-08-12'
    claim: Send payload may use LwM2M CBOR, SenML CBOR or SenML JSON; STACKWISE treats them as sensitivity alternatives, not observed frequencies.
  - evidence_id: oma_lwm2m_transport_1_2_2_send_confirmability
    source_type: normative_specification
    source_identifier: OMA LwM2M Transport Bindings 1.2.2
    source_url: https://www.openmobilealliance.org/release/LightweightM2M/V1_2_2-20240613-A/HTML-Version/OMA-TS-LightweightM2M_Transport-V1_2_2-20240613-A.html
    access_date: '2026-08-12'
    claim: CoAP Send may be Non-Confirmable; a Confirmable alternative therefore remains a valid benchmark sensitivity.
  - evidence_id: rfc7252_token_range
    source_type: standards_track_rfc
    source_identifier: RFC 7252 CoAP
    source_url: https://www.rfc-editor.org/info/rfc7252/
    access_date: '2026-08-12'
    claim: CoAP token length is encoded by TKL and is bounded by the base CoAP specification; zero- and eight-octet token anchors are used only as sensitivity endpoints.
  - evidence_id: rfc9147_record_header_choices
    source_type: standards_track_rfc
    source_identifier: RFC 9147 DTLS 1.3
    source_url: https://www.rfc-editor.org/info/rfc9147/
    access_date: '2026-08-12'
    claim: DTLS 1.3 permits 8- or 16-bit sequence fields, optional length field and optional variable-length CID; the selected values are benchmark anchors.
  - evidence_id: mqtt5_qos_packet_flows
    source_type: normative_specification
    source_identifier: MQTT Version 5.0 OASIS Standard
    source_url: https://docs.oasis-open.org/mqtt/mqtt/v5.0/mqtt-v5.0.html
    access_date: '2026-08-12'
    claim: MQTT QoS levels change PUBLISH acknowledgement flow; QoS 0, 1 and 2 are retained across the compact sensitivity set.
  - evidence_id: oma_mqtt_topic_example
    source_type: normative_specification
    source_identifier: OMA LwM2M Transport Bindings 1.2.2 MQTT topic example
    source_url: https://www.openmobilealliance.org/release/LightweightM2M/V1_2_2-20240613-A/HTML-Version/OMA-TS-LightweightM2M_Transport-V1_2_2-20240613-A.html
    access_date: '2026-08-12'
    claim: MQTT topics include deployment-specific ENDPOINT and optional PREFIX; 36-byte UUID-like endpoint and 8-byte tenant-a prefix anchors come from the specification example.
  - evidence_id: rfc9293_tcp_option_space
    source_type: internet_standard
    source_identifier: RFC 9293 TCP
    source_url: https://www.rfc-editor.org/info/rfc9293/
    access_date: '2026-08-12'
    claim: TCP option space is controlled by the header Data Offset; zero and 40 option-byte anchors span the base-to-maximum header option space without claiming usage frequency.


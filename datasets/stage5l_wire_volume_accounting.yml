schema_version: 1
stage: Stage-5L standards-based cellular IP wire-volume accounting
stage5_status: standards_known_component_floors_materialised_exact_wire_volume_blocked_by_lwm2m_serialization_and_session_traffic

scientific_policy:
  inherited_protocol_envelope: datasets/stage5k_protocol_envelope_variants.yml
  inherited_tariff_evidence: datasets/stage5i_dated_cellular_cost_evidence.yml
  standards_review_date: '2026-08-12'
  tariff_megabyte_definition_bytes: 1000000
  pre_lwm2m_payload_is_not_silently_equated_to_serialized_payload: true
  infer_lwm2m_serialized_payload_length_from_application_payload_bytes: false
  compute_strict_primary_exchange_floor: true
  compute_anchor_known_component_accounting: true
  exact_wire_volume_authorised: false
  exact_tariff_topup_count_authorised: false
  canonical_report_energy_authorised: false
  publication_mcda_authorised: false
  billing_rounding_interval_is_unresolved: true
  tariff_interpretation: >-
    1NCE states that both uplink and downlink transport data, TCP/UDP overhead and payload are counted,
    but the reviewed source does not identify the aggregation interval used for nearest-1-kByte billing.
    Therefore Stage 5L compares a raw transport-byte floor with the nominal 500-MB allowance but does
    not convert this comparison into an exact billed-volume or TopUp claim.
  strict_floor_semantics: >-
    The strict transport floor contains only the primary LwM2M Send request and its mandatory response,
    with the serialized LwM2M data payload length set to zero. It retains standards-required protocol
    structure and the Stage-5K header selections but omits all additional positive components such as
    security establishment/resumption, MQTT pure TCP ACK/segmentation traffic, extra QoS exchanges,
    keep-alives, retries and billing-rounding effects. It is a one-sided known-component floor, not an
    estimate of actual traffic.
  anchor_accounting_semantics: >-
    The anchor accounting additionally materialises Stage-5K response-mode, QoS, keep-alive and retry
    choices under a deterministic one-control-message-per-protected-transport-episode convention. It is
    a sensitivity accounting quantity, not an empirical packetisation claim and not the basis for a
    categorical tariff sufficiency statement.
  tariff_transport_floor_excludes_ip_header: true
  tariff_transport_floor_exclusion_reason: >-
    The reviewed 1NCE source explicitly states that TCP/UDP overhead and payload are counted but does
    not explicitly state whether the IP header itself is included. Stage 5L therefore excludes IP headers
    from the tariff-side floor and reports a separate IP-wire floor including IPv4/IPv6 headers.

accounting_conventions:
  ipv4_min_header_bytes: 20
  ipv6_fixed_header_bytes: 40
  udp_header_bytes: 8
  tcp_base_header_bytes: 20
  coap_base_header_bytes: 4
  coap_send_uri_path: /dp
  coap_payload_marker_bytes_when_payload_present: 1
  tls_ciphertext_header_bytes: 5
  tls_inner_content_type_bytes: 1
  dtls_inner_content_type_bytes: 1
  mqtt_publish_zero_property_length_bytes: 1
  mqtt_success_ack_control_packet_bytes: 4
  mqtt_ping_control_packet_bytes: 2
  mqtt_nonbootstrap_topic_literal: lwm2m/rd/
  mqtt_primary_exchange_response_result: 204
  mqtt_send_operation_code: 24
  serialized_lwm2m_payload_placeholder_for_strict_floor_bytes: 0

standards_evidence:
  - evidence_id: oma_lwm2m_core_send_payload_formats
    source_type: normative_specification
    source_identifier: OMA LwM2M Core 1.2.2
    source_url: https://www.openmobilealliance.org/release/lightweightm2m/V1_2_2-20240613-A/HTML-Version/OMA-TS-LightweightM2M_Core-V1_2_2-20240613-A.html
    access_date: '2026-08-12'
    claim: LwM2M Send payload can use LwM2M CBOR, SenML CBOR or SenML JSON; encoding choice alone does not identify serialized length for a pre-LwM2M benchmark payload.
  - evidence_id: oma_lwm2m_coap_send_mapping
    source_type: normative_specification
    source_identifier: OMA LwM2M Transport Bindings 1.2.2
    source_url: https://www.openmobilealliance.org/release/LightweightM2M/V1_2_2-20240613-A/HTML-Version/OMA-TS-LightweightM2M_Transport-V1_2_2-20240613-A.html
    access_date: '2026-08-12'
    claim: CoAP Send uses POST /dp with an allowed Send Content-Format and has a 2.04 Changed success response; Send may be Non-Confirmable.
  - evidence_id: oma_lwm2m_mqtt_send_cbor_mapping
    source_type: normative_specification
    source_identifier: OMA LwM2M Transport Bindings 1.2.2 MQTT mapping
    source_url: https://www.openmobilealliance.org/release/LightweightM2M/V1_2_2-20240613-A/HTML-Version/OMA-TS-LightweightM2M_Transport-V1_2_2-20240613-A.html
    access_date: '2026-08-12'
    claim: MQTT Send uses a CBOR IR_Payload with operation=24, token, content type and byte-string payload; the successful Generic Response uses result=204 and token.
  - evidence_id: rfc7252_coap_message_and_options
    source_type: standards_track_rfc
    source_identifier: RFC 7252 CoAP
    source_url: https://www.rfc-editor.org/info/rfc7252/
    access_date: '2026-08-12'
    claim: CoAP has a four-byte base header, variable token/options and a payload marker when a payload is present.
  - evidence_id: rfc9147_dtls13_record_header
    source_type: standards_track_rfc
    source_identifier: RFC 9147 DTLS 1.3
    source_url: https://www.rfc-editor.org/info/rfc9147/
    access_date: '2026-08-12'
    claim: DTLS 1.3 unified record headers support optional CID, one- or two-byte sequence number and optional length field; protected inner plaintext carries a content type.
  - evidence_id: rfc9846_tls13_record_layer
    source_type: standards_track_rfc
    source_identifier: RFC 9846 TLS 1.3
    source_url: https://www.rfc-editor.org/info/rfc9846/
    access_date: '2026-08-12'
    claim: TLSCiphertext has a five-byte record header and encrypted TLSInnerPlaintext includes the content type and optional padding.
  - evidence_id: mqtt5_publish_qos_and_ping_packets
    source_type: normative_specification
    source_identifier: MQTT Version 5.0 OASIS Standard
    source_url: https://docs.oasis-open.org/mqtt/mqtt/v5.0/mqtt-v5.0.html
    access_date: '2026-08-12'
    claim: MQTT PUBLISH contains topic, optional QoS packet identifier and properties; minimal success PUBACK/PUBREC/PUBREL/PUBCOMP packets have Remaining Length 2, while PINGREQ/PINGRESP have zero Remaining Length.
  - evidence_id: rfc768_udp_header
    source_type: internet_standard
    source_identifier: RFC 768 UDP
    source_url: https://www.rfc-editor.org/info/rfc768/
    access_date: '2026-08-12'
    claim: UDP minimum datagram length is eight octets, establishing an eight-byte UDP header.
  - evidence_id: rfc9293_tcp_header
    source_type: internet_standard
    source_identifier: RFC 9293 TCP
    source_url: https://www.rfc-editor.org/info/rfc9293/
    access_date: '2026-08-12'
    claim: TCP uses a twenty-byte base header with variable option space controlled by Data Offset.
  - evidence_id: rfc791_ipv4_header
    source_type: internet_standard
    source_identifier: RFC 791 IPv4
    source_url: https://www.rfc-editor.org/info/rfc791/
    access_date: '2026-08-12'
    claim: Stage 5L uses the minimum twenty-byte IPv4 header as the IPv4 sensitivity anchor.
  - evidence_id: rfc8200_ipv6_header
    source_type: internet_standard
    source_identifier: RFC 8200 IPv6
    source_url: https://www.rfc-editor.org/info/rfc8200/
    access_date: '2026-08-12'
    claim: IPv6 has a forty-byte fixed header before extension headers.
  - evidence_id: one_nce_transport_data_accounting
    source_type: official_operator_documentation
    source_identifier: 1NCE Customer Support / Data Consumption
    source_url: https://www.1nce.com/en-eu/support
    access_date: '2026-08-12'
    claim: The 500-MB allowance counts uplink and downlink transport data, including TCP/UDP overhead and user payload, measured/billed to the nearest 1 kByte; aggregation interval remains unspecified in the reviewed material.

expected:
  variant_rows: 90
  coap_variant_rows: 45
  mqtt_variant_rows: 45
  rows_with_strict_transport_floor: 90
  rows_with_anchor_known_component_accounting: 90
  rows_with_exact_wire_volume: 0
  rows_with_unresolved_lwm2m_serialization: 90
  mqtt_rows_with_unresolved_tcp_ack_segmentation: 45
  rows_with_unresolved_session_increment: 20
  rows_where_strict_raw_transport_floor_exceeds_nominal_allowance: 27
  rows_where_strict_raw_transport_floor_is_within_nominal_allowance: 63

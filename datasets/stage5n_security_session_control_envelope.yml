# The two designs are deterministic sensitivity anchors, not lower/upper bounds on
# all possible deployments. PSK mode is standards-valid in LwM2M, but Certificate
# and Raw Public Key modes remain outside this compact envelope.
session_control_envelope_designs:
  - envelope_id: E0_compact_psk_control
    semantics: >-
      Compact PSK session/control surrogate: TLS/DTLS psk_ke, 16-byte PSK identity,
      compact DTLS encrypted record header and coalesced server DTLS flight; no
      standalone TCP ACK-only segment is added because cumulative/delayed/piggybacked
      acknowledgement may absorb it.
    psk_identity_bytes: 16
    psk_dhe: false
    x25519_key_share_bytes: 32
    sha256_hash_bytes: 32
    aead_expansion_bytes: 16
    dtls_unified_header_bytes: 2
    dtls_server_flight_combined_datagram: true
    one_pure_tcp_ack_per_modeled_data_segment: false

  - envelope_id: E1_expanded_psk_dhe_control
    semantics: >-
      Expanded PSK-DHE session/control surrogate: TLS/DTLS psk_dhe_ke with X25519,
      64-byte PSK identity, six-byte DTLS unified-header sensitivity and separate
      server DTLS records/datagrams. MQTT/TCP adds one ACK-only segment per modeled
      data-carrying TCP segment. This is an expanded deterministic anchor, not a
      protocol upper bound; real segmentation/retransmission may be larger and
      delayed/piggybacked ACK behaviour may be smaller.
    psk_identity_bytes: 64
    psk_dhe: true
    x25519_key_share_bytes: 32
    sha256_hash_bytes: 32
    aead_expansion_bytes: 16
    dtls_unified_header_bytes: 6
    dtls_server_flight_combined_datagram: false
    one_pure_tcp_ack_per_modeled_data_segment: true

standards_evidence:
  - evidence_id: rfc9846_tls13_psk
    source_type: standards_track_rfc
    source_identifier: RFC 9846 TLS 1.3
    source_url: https://www.rfc-editor.org/rfc/rfc9846.html
    access_date: '2026-08-12'
    claim: >-
      TLS 1.3 supports PSK handshakes from external PSKs or prior sessions; psk_ke and
      psk_dhe_ke define whether a key_share exchange is used. STACKWISE sizes two
      deterministic PSK grammar surrogates and does not claim observed deployment frequency.
  - evidence_id: rfc9846_tls_aes128_gcm_sha256
    source_type: standards_track_rfc
    source_identifier: RFC 9846 TLS 1.3
    source_url: https://www.rfc-editor.org/rfc/rfc9846.html
    access_date: '2026-08-12'
    claim: TLS_AES_128_GCM_SHA256 is mandatory to implement; Stage 5N uses its SHA-256 Finished/binder and 16-byte GCM tag as a deterministic cryptographic-size anchor.
  - evidence_id: rfc9147_dtls13_record_ack
    source_type: standards_track_rfc
    source_identifier: RFC 9147 DTLS 1.3
    source_url: https://www.rfc-editor.org/rfc/rfc9147.html
    access_date: '2026-08-12'
    claim: >-
      DTLS 1.3 uses 12-byte Handshake framing, DTLSPlaintext epoch/sequence headers,
      a variable unified encrypted-record header, and a mandatory ACK for a final
      handshake flight that has no expected response. Stage 5N includes one final-flight ACK.
  - evidence_id: rfc9293_tcp_delayed_ack
    source_type: internet_standard
    source_identifier: RFC 9293 TCP
    source_url: https://www.rfc-editor.org/rfc/rfc9293.html
    access_date: '2026-08-12'
    claim: >-
      TCP SHOULD implement delayed ACK; acknowledgement timing/count is therefore not
      uniquely inferable from application messages. STACKWISE uses zero standalone ACKs
      and one ACK-only segment per modeled data segment as deterministic sensitivity anchors,
      not canonical packet counts.
  - evidence_id: mqtt5_connect_connack_keepalive
    source_type: normative_specification
    source_identifier: MQTT Version 5.0 OASIS Standard
    source_url: https://docs.oasis-open.org/mqtt/mqtt/v5.0/mqtt-v5.0.html
    access_date: '2026-08-12'
    claim: >-
      A new MQTT network connection starts with CONNECT and successful CONNACK; Keep Alive
      zero disables the required PING schedule. Stage 5N adds a minimal CONNECT/CONNACK
      surrogate when the Stage-5K security lifecycle rebuilds the TLS/TCP connection.
  - evidence_id: oma_lwm2m_security_modes
    source_type: normative_specification
    source_identifier: OMA LwM2M Core 1.2.2
    source_url: https://www.openmobilealliance.org/release/lightweightm2m/V1_2_2-20240613-A/HTML-Version/OMA-TS-LightweightM2M_Core-V1_2_2-20240613-A.html
    access_date: '2026-08-12'
    claim: LwM2M Security Mode explicitly includes Pre-Shared Key mode; Stage 5N uses PSK as a valid benchmark security surrogate while keeping RPK/certificate modes outside this compact envelope.


minimum_experiment_contract:
  status: measurement_required
  hardware_rule: 'Use one dual-mode LTE-M/NB-IoT application platform for all four candidates; hardware family is not frozen by this contract.'
  reference_platform_note: 'An nRF91-family dual-mode SiP is an admissible implementation because the same application MCU/SiP can operate LTE-M and NB-IoT and supports rail current measurement on DK hardware; equivalent platforms are allowed.'
  operator_rule: 'Use one SIM/operator supporting both LTE-M and NB-IoT in the same study location. If that is impossible, the result is not treated as a fully matched Grade-A comparison.'
  energy_boundary: 'Measured DUT rail only: application MCU + memory + cellular modem + protocol/security processing, from scheduled report trigger until return to the frozen post-report sleep state. External debugger, USB interface and measurement instrument are excluded. Sensor acquisition is excluded because the benchmark payload is synthetically generated and identical across candidates.'
  primary_payload_shape: 'single Opaque LwM2M Resource surrogate from Stage 5M, 64 pre-LwM2M application bytes'
  reporting_interval_s: 60
  primary_session_policy: 'fresh transport/security application session per scheduled report; deterministic conservative benchmark, not claimed typical'
  robustness_session_policy: 'resumption/context-reuse path where supported and observable; retained as an unweighted sensitivity member, never substituted silently when unsupported'
  replication_unit: 'one complete scheduled 60-s report cycle'
  blocking_unit: 'time block containing all four RAT×binding candidates in randomized order under the same site/operator setup'
  pilot_blocks: 5
  final_replication_count: 'not frozen before pilot; determine from observed between-block variance and a predeclared precision/power criterion before the main run'
  failed_reports_policy: 'Do not discard failed cycles. Record success, retries and energy for every scheduled report. If failure is non-negligible, delivery probability must re-enter the decision slice rather than conditioning energy only on successful reports.'
  mandatory_logged_covariates: 'RSRP|RSRQ|SINR_or_available_quality|cell_id|band|RAT|operator|firmware|modem_firmware|PSM_grant|eDRX_grant|T3324|T3412|RAI_or_release_behavior|retries|bytes_ul|bytes_dl|report_success|session_outcome'
  mandatory_energy_outputs: 'cycle_energy_j|active_transaction_energy_j|cycle_duration_s|report_success'
  main_analysis: 'paired/block-aware comparison with block bootstrap or mixed-effects model; no sample-level pseudo-replication'
  publication_role: 'If completed as specified, the four primary cells can identify a candidate-boundary energy robustness input for the preferred Stage-6A development subset. The robustness session profile is reported separately unless supported for all four candidates.'


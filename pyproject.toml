[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stackwise-iot-benchmark"
version = "0.1.62"
description = "Evidence-driven and uncertainty-aware IoT communication stack benchmarking"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Oleksandr Kuznetsov", email = "oleksandr.kuznetsov@uniecampus.it"}
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "tabulate>=0.9",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "requests>=2.31",
  "jsonschema>=4.20",
  "typer>=0.12",
  "rich>=13.7",
  "pyarrow>=15.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "nbformat>=5.10",
  "jupyter>=1.0"
]
kaggle = ["kaggle>=1.6"]

[project.scripts]
stackwise = "stackwise.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true
